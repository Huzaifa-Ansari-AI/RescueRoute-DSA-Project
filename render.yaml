services:
  - type: web
    name: rescueroute-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://rescueroute-emergency.vercel.app,https://rescueroute.vercel.app,http://localhost:5173
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: OVERPASS_API_URL
        value: https://overpass-api.de/api/interpreter
