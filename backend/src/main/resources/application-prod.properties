# =============================================================================
# RescueRoute Backend — Production Configuration Profile (Render / Neon Cloud)
# Activate via: -Dspring.profiles.active=prod OR SPRING_PROFILES_ACTIVE=prod
# =============================================================================

spring.application.name=rescueroute

# -----------------------------------------------------------------------------
# Database Configuration (Neon PostgreSQL Cloud Connection)
# -----------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Cloud / Serverless Pool Settings (Neon PostgreSQL)
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=RescueRouteHikariProdPool

# JPA / Hibernate Production Settings (Safe: no destructive ddl-auto)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# -----------------------------------------------------------------------------
# Server & Port Configuration (Render dynamic PORT binding)
# -----------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# -----------------------------------------------------------------------------
# CORS Configuration (Production Frontend Origins)
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://rescueroute.vercel.app,https://rescueroute-dsa.vercel.app,http://localhost:5173}

# -----------------------------------------------------------------------------
# JWT Authentication
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------------------------------------
# OSRM Road Routing Configuration
# -----------------------------------------------------------------------------
app.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.osrm.table-path=${OSRM_TABLE_PATH:/table/v1/driving}
app.osrm.timeout-ms=${OSRM_TIMEOUT_MS:2500}
app.osrm.max-shortlist-size=${OSRM_MAX_SHORTLIST_SIZE:10}
app.osrm.cache-ttl-ms=${OSRM_CACHE_TTL_MS:60000}

# -----------------------------------------------------------------------------
# OpenStreetMap Overpass API Configuration (Phase 4 Discovery)
# -----------------------------------------------------------------------------
app.overpass.url=${OVERPASS_API_URL:https://overpass-api.de/api/interpreter}
app.overpass.timeout-ms=${OVERPASS_TIMEOUT_MS:120000}
app.overpass.default-radius-meters=${OVERPASS_DEFAULT_RADIUS_METERS:5000}
app.overpass.max-radius-meters=${OVERPASS_MAX_RADIUS_METERS:10000}
app.overpass.user-agent=${OVERPASS_USER_AGENT:RescueRoute/1.0 (rescueroute-emergency-app; production)}

# -----------------------------------------------------------------------------
# Production Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.huzaifa.rescueroute=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
